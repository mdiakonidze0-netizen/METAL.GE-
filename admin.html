<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin - METAL.GE</title>

    <script>
        if (sessionStorage.getItem("metalAdmin") !== "true") {
            window.location.replace("admin-login.html");
        }
    </script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container header-content">

        <a href="index.html" class="logo">
            METAL.GE
        </a>

        <a href="index.html">
            ← მთავარი გვერდი
        </a>

    </div>
</header>


<main class="admin-page">

    <div class="container">

        <div class="admin-header">

            <span class="section-label">
                🔐 ადმინისტრატორი
            </span>

            <h1>პროდუქტების მართვა</h1>

            <p>
                აქედან მართავ შენს მაღაზიას.
            </p>

        </div>


        <section class="admin-card">

            <h2>ახალი პროდუქტი</h2>

            <form id="productForm">

                <div class="form-group">

                    <label for="productName">
                        პროდუქტის სახელი
                    </label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="მაგ: მაისური"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="productPrice">
                            ფასი
                        </label>

                        <input
                            type="number"
                            id="productPrice"
                            placeholder="მაგ: 50"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="productCategory">
                            კატეგორია
                        </label>

                        <select id="productCategory" required>

                            <option value="">
                                აირჩიე კატეგორია
                            </option>

                            <option value="მაისური">
                                მაისური
                            </option>

                            <option value="შარვალი">
                                შარვალი
                            </option>

                            <option value="ფეხსაცმელი">
                                ფეხსაცმელი
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="productDescription">
                        აღწერა
                    </label>

                    <textarea
                        id="productDescription"
                        rows="5"
                        placeholder="პროდუქტის აღწერა..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="productImage">
                        ფოტოს URL
                    </label>

                    <input
                        type="url"
                        id="productImage"
                        placeholder="https://..."
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="productStock">
                        მარაგი
                    </label>

                    <input
                        type="number"
                        id="productStock"
                        value="10"
                        min="0"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-submit-button">

                    ➕ პროდუქტის დამატება

                </button>

            </form>

        </section>


        <section class="admin-products">

            <div class="admin-products-header">

                <h2>პროდუქტები</h2>

                <span id="productCount">
                    0 პროდუქტი
                </span>

            </div>


            <div
                id="adminProductsContainer"
                class="admin-products-list">
            </div>

        </section>

    </div>

</main>


<footer class="footer">

    <div class="container footer-content">

        <p>
            © 2026 METAL.GE
        </p>

        <a href="index.html">
            მთავარი
        </a>

    </div>

</footer>


<script src="admin.js"></script>

</body>
</html>
