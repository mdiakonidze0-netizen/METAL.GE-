<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - METAL.GE</title>

    <link rel="stylesheet" href="style.css">
</head>
<script>
document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    /*
      დროებითი შესვლა.
      აქ რეალურ პაროლს მოგვიანებით
      უსაფრთხო სისტემით ჩავანაცვლებთ.
    */

    if (username === "admin" && password === "metal123") {

        sessionStorage.setItem("metalAdmin", "true");

        window.location.href = "admin.html";

    } else {

        document.getElementById("loginMessage").textContent =
            "მომხმარებელი ან პაროლი არასწორია.";

    }

});
</script>
<body>

<main class="admin-login">

    <div class="admin-login-card">

        <h1>METAL.GE</h1>

        <p>ადმინისტრატორის შესვლა</p>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    მომხმარებელი
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    პაროლი
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button type="submit">
                შესვლა
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

</main>

</body>
</html>
