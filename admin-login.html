<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - METAL.GE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.10);
        }

        .login-card h1 {
            margin-top: 0;
            text-align: center;
        }

        .login-card p {
            text-align: center;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #111;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #loginMessage {
            color: #c00;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <h1>METAL.GE</h1>

        <p>ადმინისტრატორის შესვლა</p>

        <form id="loginForm">

            <div class="form-group">

                <label for="username">
                    მომხმარებელი
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="შეიყვანე მომხმარებელი"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">
                    პაროლი
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="შეიყვანე პაროლი"
                    autocomplete="current-password"
                    required
                >

            </div>

            <button type="submit">
                შესვლა
            </button>

            <p id="loginMessage"></p>

        </form>

    </div>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const username =
                    document.getElementById("username").value.trim();

                const password =
                    document.getElementById("password").value;

                if (
                    username === "admin" &&
                    password === "metal123"
                ) {

                    sessionStorage.setItem(
                        "metalAdmin",
                        "true"
                    );

                    window.location.href =
                        "admin.html";

                } else {

                    document.getElementById(
                        "loginMessage"
                    ).textContent =
                        "მომხმარებელი ან პაროლი არასწორია.";

                }

            });
    </script>

</body>
</html>
